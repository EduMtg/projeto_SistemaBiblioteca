<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Biblioteca</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

    <nav class="navbar">
        <a th:href="@{/}" class="active">Início</a>
        <a th:href="@{/cadastroLivros}">Livros</a>
        <a th:href="@{/autores}">Autores</a>
        <a th:href="@{/categorias}">Categorias</a>
        <a th:href="@{/usuarios}">Usuários</a>
        <a th:href="@{/emprestimos}">Empréstimos</a>
    </nav>

    <main>
        <div class="container home-container">
            <h2 class="home-title">Bem-vindo ao Sistema de Biblioteca</h2>

            <p class="home-text">
                Gerencie livros, autores, categorias, usuários e empréstimos
                de forma eficiente.
            </p>
        </div>
        <div class="container home-container">
        <section>
            <h2 class="home-title">Livros Disponíveis:</h2>
            <ul>
                <li th:each="livro : ${livros}" th:text="${livro}"></li>
            </ul>
        </section>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Biblioteca. Todos os direitos reservados.</p>
    </footer>

</body>

</html>

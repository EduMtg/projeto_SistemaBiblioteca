<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livro cadastrado</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<nav class="navbar">
    <a th:href="@{/}">Início</a>
    <a th:href="@{/cadastroLivros}" class="active">Livros</a>
    <a th:href="@{/autores}">Autores</a>
    <a th:href="@{/categorias}">Categorias</a>
    <a th:href="@{/usuarios}">Usuários</a>
    <a th:href="@{/emprestimos}">Empréstimos</a>
</nav>

<main class="container confirmation-container">

    <section class="confirmation-card">

        <div class="success-icon">✓</div>

        <h1 class="confirmation-title">
            Livro cadastrado com sucesso!
        </h1>

        <p class="confirmation-subtitle">
            Os dados do livro foram recebidos.
        </p>

        <div class="book-details">

            <div class="detail-item">
                <span class="detail-label">Título</span>
                <span class="detail-value" th:text="${titulo}">Título do livro</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Autor</span>
                <span class="detail-value" th:text="${autor}">Nome do autor</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">ISBN</span>
                <span class="detail-value" th:text="${isbn}">ISBN do livro</span>
            </div>

        </div>

        <a th:href="@{/cadastroLivros}" class="btn-back">
            ← Cadastrar outro livro
        </a>

        <a th:href="@{/}" class="link-home">
            Voltar para o início
        </a>

    </section>

</main>

<footer class="footer">
    <p>&copy; 2026 Biblioteca. Todos os direitos reservados.</p>
</footer>

</body>
</html>

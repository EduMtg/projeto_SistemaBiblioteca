<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Autores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
    <a th:href="@{/}">Início</a>
    <a th:href="@{/cadastroLivros}">Livros</a>
    <a th:href="@{/autores}" class="active">Autores</a>
    <a th:href="@{/categorias}">Categorias</a>
    <a th:href="@{/usuarios}">Usuários</a>
    <a th:href="@{/emprestimos}">Empréstimos</a>
</nav>

<main class="container">
    <form class="form-card" action="/livros/confirmacaoAutor" method="post">
        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
        </div>
        <div class="form-group">
            <label for="nacionalidade">Nacionalidade:</label>
            <input type="text" id="nacionalidade" name="nacionalidade" required>
        </div>
        <div class="form-group">
            <label for="qtdLivrosPublicados">Quantidade de livros publicados:</label>
            <input type="number" id="qtdLivrosPublicados" name="qtdLivrosPublicados" min="0" required>
        </div>
        <button type="submit" class="btn-submit">
            Adicionar Autor
        </button>
    </form>

</main>

<footer class="footer">
    <p>&copy; 2026 Biblioteca. Todos os direitos reservados.</p>
</footer>
</body>
</html>
